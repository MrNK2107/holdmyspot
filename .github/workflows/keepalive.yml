name: keepalive

# Pings the deployed service so Render's free plan does not spin it down
# (idle ~15 min), and fails the run (GitHub emails the owner) if it is down.
# Set the repo variable SERVICE_URL, e.g. https://holdmyspot.onrender.com

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then echo "SERVICE_URL variable not set; nothing to ping"; exit 0; fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            "${SERVICE_URL%/}/api/health"
